language: julia

os:
  - linux

addons:
  apt:
    packages:
      - graphviz
      - ttf-dejavu

julia:
  - 1.0

matrix:
  allow_failures:
    - julia: nightly

notifications:
  email: false

jobs:
  include:
    - stage: "Testing"
      script:
        - travis_wait 30 julia --project -e 'using Pkg; Pkg.build(); Pkg.test("SemanticModels")'
    - stage: "Documentation"
      script:
        - julia --project=docs/ -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd()));
                                               Pkg.instantiate()'
        - julia --project=doc/ doc/make.jl
